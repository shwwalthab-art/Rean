<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعترافات ريان - Confessions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #ff4081;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #ff4081;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff4081;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #e03570;
        }

        .confessions-list {
            margin-top: 30px;
        }

        .confessions-list h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #ff4081;
        }

        .confession-card {
            background: #282828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-right: 4px solid #ff4081;
        }

        .confession-card .author {
            font-weight: bold;
            color: #888;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .confession-card .text {
            line-height: 1.5;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>اعترافات ريان</h1>
        <p class="subtitle">شاركونا اعترافاتكم أو رسائلكم السرية بدون كشف الهوية</p>

        <form id="confessionForm">
            <div class="form-group">
                <label for="authorInput">الاسم (اختياري):</label>
                <input type="text" id="authorInput" placeholder="مجهول">
            </div>

            <div class="form-group">
                <label for="confessionInput">اعترافك:</label>
                <textarea id="confessionInput" placeholder="اكتب اعترافك هنا بكل حرية..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">إرسال الاعتراف</button>
        </form>

        <div class="confessions-list">
            <h2>الاعترافات الأخيرة</h2>
            <div id="confessionsContainer">
                <!-- سيتم عرض الاعترافات هنا -->
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('confessionForm');
        const authorInput = document.getElementById('authorInput');
        const confessionInput = document.getElementById('confessionInput');
        const confessionsContainer = document.getElementById('confessionsContainer');

        // تحميل الاعترافات المحفوظة
        document.addEventListener('DOMContentLoaded', loadConfessions);

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const author = authorInput.value.trim() || 'مجهول';
            const text = confessionInput.value.trim();

            if (text !== '') {
                const confession = { author, text };
                saveConfession(confession);
                addConfessionToDOM(confession);

                // إعادة ضبط الحقول
                confessionInput.value = '';
                authorInput.value = '';
            }
        });

        function addConfessionToDOM(confession) {
            const card = document.createElement('div');
            card.className = 'confession-card';

            card.innerHTML = `
                <div class="author">من: ${escapeHTML(confession.author)}</div>
                <div class="text">${escapeHTML(confession.text)}</div>
            `;

            confessionsContainer.prepend(card);
        }

        function saveConfession(confession) {
            let confessions = JSON.parse(localStorage.getItem('rayan_confessions')) || [];
            confessions.push(confession);
            localStorage.setItem('rayan_confessions', JSON.stringify(confessions));
        }

        function loadConfessions() {
            let confessions = JSON.parse(localStorage.getItem('rayan_confessions')) || [];
            confessions.forEach(addConfessionToDOM);
        }

        // الحماية من هجمات XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
